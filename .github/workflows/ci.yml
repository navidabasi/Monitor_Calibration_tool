name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }   # Apple Silicon
          - { os: macos-15-intel, python: "3.13" }       # Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v

  bare-machine:
    # Runs the one-line start scripts the way a user without Python would,
    # with uv downloading its own Python into isolated folders.
    name: Bare machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    env:
      UV_PYTHON_PREFERENCE: only-managed
      MONCAL_SOURCE: .
    steps:
      - uses: actions/checkout@v4
      - name: Isolate uv folders
        shell: bash
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          echo "UV_PYTHON_INSTALL_DIR=$RUNNER_TEMP/uv-python" >> "$GITHUB_ENV"
          echo "UV_TOOL_DIR=$RUNNER_TEMP/uv-tools" >> "$GITHUB_ENV"
      - name: run.sh --version
        if: runner.os != 'Windows'
        run: sh run.sh --version
      - name: run.ps1 --version
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./run.ps1 --version

  api-tests:
    name: API tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -p "test_api*.py" -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit -e .
      - run: pip-audit

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
