<!doctype html>
<html lang="en">
<head>

  <meta name="mc-token" content="__MC_TOKEN__">

  <link rel="stylesheet" href="style.css">

<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">Monitor calibration</div>
      <nav class="steps" id="nav">
        <a href="#setup" data-step="setup"><span class="num">1</span>Setup</a>
        <a href="#prep" data-step="prep"><span class="num">2</span>Prepare</a>
        <a href="#photos" data-step="photos"><span class="num">3</span>Take photos</a>

    <section id="setup" class="page"></section>
    <section id="prep" class="page"></section>
